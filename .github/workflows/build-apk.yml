name: Build & Publish Great White TV

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "auto/greatwhite-latest.apk"
      - "auto/update.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: great-white-tv-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Verify signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$RELEASE_STORE_PASSWORD" || (echo "Missing RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$RELEASE_KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$RELEASE_KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Restore permanent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/greatwhite-release.jks
          test -s signing/greatwhite-release.jks

      - name: Set release version
        run: |
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=5.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build permanently signed TV release APK
        env:
          RELEASE_STORE_FILE: signing/greatwhite-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :tv:assembleRelease

      - name: Verify APK exists and is signed
        run: |
          APK="tv/build/outputs/apk/release/tv-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare in-app update package
        run: |
          APK="tv/build/outputs/apk/release/tv-release.apk"
          cp "$APK" auto/greatwhite-latest.apk
          SHA256=$(sha256sum auto/greatwhite-latest.apk | awk '{print $1}')
          cat > auto/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://raw.githubusercontent.com/boberthegr8/greatwhitestreams4/main/auto/greatwhite-latest.apk",
            "releaseNotes": "Latest Great White Streams TV update.",
            "mandatory": false,
            "sha256": "${SHA256}"
          }
          EOF

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteStreams-TV-${{ env.VERSION_NAME }}
          path: tv/build/outputs/apk/release/tv-release.apk
          if-no-files-found: error

      - name: Publish latest APK and update metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto/greatwhite-latest.apk auto/update.json
          if git diff --cached --quiet; then
            echo "No update files changed."
            exit 0
          fi
          git commit -m "Publish Great White TV ${VERSION_NAME} [skip ci]"
          git push
